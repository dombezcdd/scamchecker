<!DOCTYPE html>
<html>
<head>
    <title>Scam Checker</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .search-box {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        input:focus {
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .result {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .scam {
            background: linear-gradient(135deg, #ff6b6b, #c23616);
            color: white;
        }
        
        .safe {
            background: linear-gradient(135deg, #4cd137, #44bd32);
            color: white;
        }
        
        .scam-list {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .scam-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: between;
        }
        
        .scam-item:last-child {
            border-bottom: none;
        }
        
        .badge {
            background: #ff6b6b;
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Scam Checker</h1>
            <p>Проверьте пользователя на мошенничество</p>
        </div>
        
        <div class="search-box">
            <div class="input-group">
                <input type="text" id="searchInput" placeholder="Введите @username или номер...">
            </div>
            <button onclick="checkUser()">Проверить на скам</button>
        </div>
        
        <div id="result" class="result"></div>
        
        <div class="scam-list">
            <h3 style="margin-bottom: 15px;">🚨 Последние мошенники</h3>
            <div id="scamItems"></div>
        </div>
    </div>

    <script>
        // База данных мошенников
        const scamDatabase = {
            "scammer1": {type: "Продажа несуществующих товаров", date: "15.12.2024"},
            "scammer2": {type: "Фейковый магазин", date: "10.12.2024"},
            "+79123456789": {type: "Кидала на предоплате", date: "05.12.2024"},
            "fake_store": {type: "Обман при доставке", date: "01.12.2024"},
            "trust_me": {type: "Фишинг", date: "28.11.2024"}
        };
        
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        // Заполняем список мошенников
        function loadScamList() {
            const container = document.getElementById('scamItems');
            container.innerHTML = '';
            
            Object.entries(scamDatabase).forEach(([username, info]) => {
                const item = document.createElement('div');
                item.className = 'scam-item';
                item.innerHTML = `
                    <div>
                        <strong>${username}</strong>
                        <div style="font-size: 12px; color: #666;">${info.type}</div>
                    </div>
                    <div class="badge">${info.date}</div>
                `;
                container.appendChild(item);
            });
        }
        
        // Проверка пользователя
        function checkUser() {
            const input = document.getElementById('searchInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!input) {
                showResult('Введите данные для проверки', 'error');
                return;
            }
            
            if (scamDatabase[input]) {
                const info = scamDatabase[input];
                showResult(`
                    <div style="text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 10px;">🚨</div>
                        <h2 style="margin-bottom: 10px;">ОПАСНО!</h2>
                        <p><strong>${input}</strong> - мошенник!</p>
                        <p>Тип: ${info.type}</p>
                        <p>Добавлен: ${info.date}</p>
                    </div>
                `, 'scam');
            } else {
                showResult(`
                    <div style="text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 10px;">✅</div>
                        <h2 style="margin-bottom: 10px;">Безопасно</h2>
                        <p><strong>${input}</strong> не найден в базе мошенников</p>
                    </div>
                `, 'safe');
            }
        }
        
        // Показать результат
        function showResult(content, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = content;
            resultDiv.className = 'result ' + type;
            resultDiv.style.display = 'block';
            
            // Прокрутка к результату
            resultDiv.scrollIntoView({behavior: 'smooth'});
        }
        
        // Загружаем список при старте
        loadScamList();
        
        // Поиск при нажатии Enter
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkUser();
            }
        });
    </script>
</body>
</html>
